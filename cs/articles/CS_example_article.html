<!DOCTYPE HTML>
<html lang="cs">
    <head>
        <title>Article | Badatales</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
        <link rel="stylesheet" href="../../../assets/css/main.css" />
        <noscript><link rel="stylesheet" href="../../../assets/css/noscript.css" /></noscript>
    </head>
    <body class="page-article" data-root="../../">
 
        <div id="page-wrapper">
 
            <header id="header">
                <h1><a href="../../index.html">Badatales</a></h1>
                <nav id="nav">
                    <ul>
                        <li class="special">
                            <a href="#menu" class="menuToggle"><span>Menu</span></a>
                            <div id="menu">
                                <ul id="nav-links"></ul>
                            </div>
                        </li>
                    </ul>
                </nav>
            </header>
            

            <!-- Article header — colour + title + tags injected by JS -->
             <section id="article-header">
                <div class="article-header__inner">
                    <div class="article-header__tags" id="articleTags"></div>
                    <h1 class="article-header__title" id="articleTitle"></h1>
                </div>

            	<a href="#one" class="more scrolly" id="scrollRead"></a>
            </section>
            
            <!-- Hero image -->
            <div id="article-hero">
                <img id="articleHero" src="hero.jpg" alt="" />
            </div>

            <!-- Article body — paste content here -->
            <article id="article-body">
                <div class="article-body__inner" id="one">

                    <!-- ======================================
                         PASTE YOUR ARTICLE CONTENT HERE
                         
                         For wide 16:9 images use:
                         <figure class="article-img article-img--wide">
                             <img src="photo.jpg" alt="description" />
                             <figcaption>Optional caption</figcaption>
                         </figure>
                         
                         For vertical/portrait images use:
                         <figure class="article-img article-img--portrait">
                             <img src="photo.jpg" alt="description" />
                         </figure>
                    ====================================== -->

                    <p>Your article content goes here.</p>

                </div>
            </article>

            <!-- You might like -->
            <section id="you-might-like">
                <div class="inner">
                    <h2 class="you-might-like__heading">Mohlo by se vám líbit</h2>
                    <div class="you-might-like__cards" id="suggestedArticles"></div>
                    <ul class="actions special">
                        <li><a href="../../articles.html" class="button">Další články</a></li>
                    </ul>
                </div>
            </section>


            
		<!-- Footer SET UP IN main.js-->
		<footer id="footer"></footer>



            
        </div>


        <div id="copyMessage">Email zkopírován ✓</div>
        <script src="../../../assets/js/jquery.min.js"></script>
        <script src="../../../assets/js/jquery.scrollex.min.js"></script>
        <script src="../../../assets/js/jquery.scrolly.min.js"></script>
        <script src="../../../assets/js/browser.min.js"></script>
        <script src="../../../assets/js/breakpoints.min.js"></script>
        <script src="../../../assets/js/util.js"></script>
        <script src="../../../assets/js/main.js"></script>

        <script>
            function copyEmail(event) {
                event.preventDefault();
                navigator.clipboard.writeText("talesofbada@gmail.com").then(function() {
                    const message = document.getElementById("copyMessage");
                    message.classList.add("show");
                    setTimeout(function() { message.classList.remove("show"); }, 1500);
                }).catch(function(err) { console.error("Clipboard copy failed:", err); });
            }
        </script>
        
    </body>
</html>
